<!DOCTYPE html>
<html>
<head>
  <title>Processing Login</title>
  <script src="https://cdn.auth0.com/js/auth0/9.19/auth0.min.js"></script>
</head>
<body>
  <p>Please wait, logging you in...</p>

  <script>
    // Initialize Auth0 client
    const auth0Client = new auth0.WebAuth({
      domain: 'dev-x4vh5dn1puh03czq.us.auth0.com',
      clientID: '6czlw25A9kwR2vTCSI1G3IFStxnqHyJ0'
    });
    
    // Process authentication result
    window.addEventListener('load', function() {
      auth0Client.parseHash(function(err, result) {
        if (result && result.accessToken) {
          // Store the tokens
          localStorage.setItem('access_token', result.accessToken);
          localStorage.setItem('id_token', result.idToken);
          
          // Redirect to protected page
          window.location.href = 'secure.html';
        } else if (err) {
          console.log('Login failed:', err);
          window.location.href = 'index.html';
        }
      });
    });
  </script>
</body>
</html>
