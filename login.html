<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <script src="https://cdn.auth0.com/js/auth0/9.19/auth0.min.js"></script>
</head>
<body>
  <h2>Welcome</h2>
  <p>Click below to login and access the protected content</p>
  <button id="loginButton">Login</button>

  <script>
    // Initialize Auth0 client
    const auth0Client = new auth0.WebAuth({
      domain: 'dev-x4vh5dn1puh03czq.us.auth0.com',
      clientID: '6czlw25A9kwR2vTCSI1G3IFStxnqHyJ0',
      redirectUri: window.location.origin + '/callback.html',
      responseType: 'token id_token',
      scope: 'openid profile'
    });
    
    // Set up login button
    document.getElementById('loginButton').addEventListener('click', function() {
      auth0Client.authorize();
    });
  </script>
</body>
</html>
