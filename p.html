<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email with Attachment</title>
</head>
<body>
    <h2>Select a File and Send via Gmail</h2>

    <form id="emailForm">
        <input type="email" id="recipient" placeholder="Recipient Email" required><br><br>
        <input type="file" id="fileInput" accept="image/*,application/pdf" required><br><br>
        <button type="button" id="sendEmail">Send via Gmail</button>
    </form>

    <script>
        document.getElementById("sendEmail").addEventListener("click", function () {
            let recipient = document.getElementById("recipient").value;
            let file = document.getElementById("fileInput").files[0];

            if (!recipient || !file) {
                alert("Please enter an email and select a file!");
                return;
            }

            // Create a temporary URL for the file
            let fileURL = URL.createObjectURL(file);

            // Open Gmail with attachment
            window.location.href = `mailto:${recipient}?subject=Attached Document&body=Please find the attached file.&attachment=${fileURL}`;
        });
    </script>
</body>
</html>
