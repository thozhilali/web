<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Document Sender</title>
</head>
<body>

    <h2>Select a Document</h2>
    <input type="file" id="fileInput" accept="application/pdf,image/*">
    <p id="fileName"></p>

    <button id="sendButton" disabled>Send via WhatsApp</button>

    <script>
        let selectedFile = null;
        const whatsappNumber = "9419339434"; // Predefined WhatsApp number

        document.getElementById("fileInput").addEventListener("change", function(event) {
            selectedFile = event.target.files[0];
            document.getElementById("fileName").innerText = selectedFile ? "File Selected: " + selectedFile.name : "";
            document.getElementById("sendButton").disabled = !selectedFile;
        });

        document.getElementById("sendButton").addEventListener("click", function() {
            if (selectedFile) {
                alert("WhatsApp does not allow automatic file attachments. You will need to manually attach the file after WhatsApp opens.");
                
                let whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent("Please find the attached document.")}`;
                window.open(whatsappURL, "_blank");
            } else {
                alert("Please select a file first!");
            }
        });
    </script>

</body>
</html>
