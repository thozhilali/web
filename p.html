<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR AI Object Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; box-sizing: border-box; }
        body { background: black; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }

        .vr-container { 
            display: flex; 
            width: 100vw; 
            height: 100vh;
            position: relative;
        }

        .video-wrapper {
            width: 50vw;  
            height: 100vh;  
            position: relative;
        }

        video {
            width: 100%;  
            height: 100%;  
            object-fit: cover;
            position: absolute;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Prevent interaction */
        }
    </style>
</head>
<body>
    <div class="vr-container">
        <div class="video-wrapper">
            <video id="video-left" autoplay playsinline></video>
            <canvas id="canvas-left"></canvas>
        </div>
        <div class="video-wrapper">
            <video id="video-right" autoplay playsinline></video>
            <canvas id="canvas-right"></canvas>
        </div>
    </div>

    <script>
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } // Change to "user" for front camera
                });

                document.getElementById('video-left').srcObject = stream;
                document.getElementById('video-right').srcObject = stream;

                startObjectDetection();
            } catch (error) {
                console.error("Camera access error:", error);
            }
        }

        async function startObjectDetection() {
            const videoLeft = document.getElementById('video-left');
            const videoRight = document.getElementById('video-right');
            const canvasLeft = document.getElementById('canvas-left');
            const canvasRight = document.getElementById('canvas-right');
            const ctxLeft = canvasLeft.getContext('2d');
            const ctxRight = canvasRight.getContext('2d');

            function resizeCanvas() {
                canvasLeft.width = videoLeft.videoWidth;
                canvasLeft.height = videoLeft.videoHeight;
                canvasRight.width = videoRight.videoWidth;
                canvasRight.height = videoRight.videoHeight;
            }

            const model = await cocoSsd.load();
            console.log("AI Model Loaded");

            function detectObjects() {
                if (videoLeft.readyState >= 2) {
                    resizeCanvas();
                    ctxLeft.clearRect(0, 0, canvasLeft.width, canvasLeft.height);
                    ctxRight.clearRect(0, 0, canvasRight.width, canvasRight.height);

                    // Detect objects in the left video
                    model.detect(videoLeft).then(predictions => {
                        predictions.forEach(prediction => {
                            drawBox(ctxLeft, prediction);
                        });
                    });

                    // Copy the same predictions to the right video (to maintain VR effect)
                    model.detect(videoRight).then(predictions => {
                        predictions.forEach(prediction => {
                            drawBox(ctxRight, prediction);
                        });
                    });
                }
                requestAnimationFrame(detectObjects);
            }

            function drawBox(ctx, prediction) {
                const { bbox, class: objectName, score } = prediction;
                const [x, y, width, height] = bbox;

                ctx.strokeStyle = "red";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, width, height);

                ctx.fillStyle = "red";
                ctx.font = "18px Arial";
                ctx.fillText(`${objectName} (${(score * 100).toFixed(1)}%)`, x, y - 10);
            }

            detectObjects();
        }

        startCamera();
    </script>
</body>
</html>
