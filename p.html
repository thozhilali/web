<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email with Attachment</title>
</head>
<body>
    <h2>Select a File and Send via Gmail</h2>

    <input type="file" id="fileInput" accept="image/*,application/pdf">
    <button id="sendEmail">Send Email</button>

    <script>
        document.getElementById("sendEmail").addEventListener("click", async function () {
            let fileInput = document.getElementById("fileInput");
            let file = fileInput.files[0];

            if (!file) {
                alert("Please select a file!");
                return;
            }

            let recipient = "your-email@example.com"; // Change this
            let subject = encodeURIComponent("Attached File");
            let body = encodeURIComponent("Please find the attached file.");

            // Create a Blob URL
            let fileURL = URL.createObjectURL(file);

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: "Send Email",
                        text: `Subject: ${subject}\n\n${body}`,
                        url: fileURL // Pass the file URL
                    });
                } catch (error) {
                    console.log("Error sharing:", error);
                }
            } else {
                alert("Sharing is not supported on this device.");
            }
        });
    </script>
</body>
</html>
