<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thozhilali Affliate Marketing Team</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
         <!-- Replace with your actual logo image URL -->
        <h1>Thozhilali Free College Verification In Tamil Nadi</h1>
        
        
        <form id="orderForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="gender">Gender:</label>
            <select name="gender" id="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="college">College Name</label>
            <input type="text" id="college" name="college" required>

            
            
            <button type="button" onclick="sendToWhatsApp()">Send</button>
        </form>
        <p>We Only check weather the college has UGC, NBA, AICTE and NAAC accreditation</p>
    </div>

    <script>
        function sendToWhatsApp() {
            var name = document.getElementById("name").value.trim();
            var gender = document.getElementById("gender").value.trim();
            var college = document.getElementById("college").value.trim();
            var email = document.getElementById("email").value.trim();

            if (name === "" || email === "" || college === "") {
                alert("Please fill out all fields.");
                return;
            }

            var message = `Hello, I'm interested in joining:
👤 Name: ${name}
📧 Email: ${email}
🔹 Gender: ${gender}
🔢 Interest: ${college}`;
            var encodedMessage = encodeURIComponent(message);

            var phoneNumber = "917022053990";  // No '+' sign before the number
            var whatsappLink = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
            
            window.location.href = whatsappLink; // Redirects the user to WhatsApp
        }
    </script>
</body>
</html>
