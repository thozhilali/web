<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Cities Dropdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <label for="cities">Select a City:</label>
    <select id="cities" onchange="updateColleges()">
        <option value="">-- Select a City --</option>
    </select>

    <label for="cllg">Select Colleges</label>
    <select id="cllg">
        <option value="">Select</option>
        <!-- Colleges will be populated based on the selected city -->
    </select>

    <button onclick="filterServices()">Find Services</button>

    <div id="cllg-list" class="service-card"></div>

    <script src="nba.js">
        
    </script>

</body>
</html>
