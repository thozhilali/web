
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Installation</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            padding: 0;
            text-align: center;
            background-image: url('https://gifdb.com/images/high/high-tech-internet-loop-zoom-out-vx7rx0om3qnsxlip.gif'); /* Replace with an actual animation related to CCTV */
            background-size: cover;
            background-position: center;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color:white;
            
        }
        .cta {
            font-size: 1.2em;
            margin-bottom: 20px;
            color:red;
        }
        .contact-form {
            margin-top: 30px;
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .cctv-boxes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .cctv-box {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .cctv-box img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sudandaram Technologies</h1>
        <p class="cta">CCTV Installation and all Networking Products and Solutions</p>
        
        <div class="contact-form">
            <h2>Contact us!</h2>
            <form>
                 <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>
        
            
            <label for="district">District</label>
            <select name="district" id="district">
                <option value="Thiruvallvur">Thiruvallvur</option>
                <option value="Chennai">Chennai</option>
            </select>
            
            <button type="button" onclick="sendToWhatsApp()">Send</button>
            </form>
        </div>
        <br><br>
        
        <div class="cctv-boxes">
            <div class="cctv-box">
                <img src="https://raw.githubusercontent.com/thozhilali/editth/refs/heads/main/IMG-20250218-WA0000.jpg" alt="CCTV Camera 1">

        </div>
    </div>

     <script>
        function sendToWhatsApp() {
            var name = document.getElementById("name").value.trim();
            var address = document.getElementById("address").value.trim();
            var district = document.getElementById("district").value.trim();

            if (name === "" || district === "" || address === "") {
                alert("Please fill out all fields.");
                return;
            }

            var message = `Hello, I'm interested in joining:
👤 Name: ${name}
District: ${district}
Address: ${address};
            var encodedMessage = encodeURIComponent(message);

            var phoneNumber = "919791086599";  // No '+' sign before the number
            var whatsappLink = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
            
            window.location.href = whatsappLink; // Redirects the user to WhatsApp
        }
    </script>
</body>
</html>
