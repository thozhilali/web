
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Installation</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            padding: 0;
            text-align: center;
            background-image: url('https://i.gifer.com/iLx.gif'); /* Replace with an actual animation related to CCTV */
            background-size: cover;
            background-position: center;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .cta {
            font-size: 1.2em;
            margin-bottom: 20px;
            color:red;
        }
        .contact-form {
            margin-top: 30px;
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
        }
        button {
            background: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .cctv-boxes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .cctv-box {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .cctv-box img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secure Your Property with CCTV</h1>
        <p class="cta"></p>
        
        <div class="contact-form">
            <h2>Contact us!</h2>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="text" placeholder="Your City" required>
                <input type="tel" placeholder="Your Phone Number" required>
                <button type="submit">Submit</button>
            </form>
        </div>
        
        <div class="cctv-boxes">
            <div class="cctv-box">
                <img src="cctv1.jpg" alt="CCTV Camera 1">
                <h3>Indoor Security Camera</h3>
                <p>Perfect for homes and offices. Night vision & motion detection.</p>
            </div>
            <div class="cctv-box">
                <img src="cctv2.jpg" alt="CCTV Camera 2">
                <h3>Outdoor Weatherproof Camera</h3>
                <p>Withstand all weather conditions with HD video clarity.</p>
            </div>
            <div class="cctv-box">
                <img src="cctv3.jpg" alt="CCTV Camera 3">
                <h3>360° Smart Camera</h3>
                <p>Remote control, AI-powered alerts, and night vision.</p>
            </div>
        </div>
    </div>
</body>
</html>
