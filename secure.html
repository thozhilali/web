<!DOCTYPE html>
<html>
<head>
  <title>Protected Content</title>
  <script src="https://cdn.auth0.com/js/auth0/9.19/auth0.min.js"></script>
</head>
<body>
  <div id="content" style="display:none;">
    <h1>Protected Content</h1>
    <p>This is your protected content that only logged-in users can see.</p>
    <!-- Your protected content goes here -->
    <button id="logoutButton">Logout</button>
  </div>
  
  <p id="loading">Checking your login status...</p>

  <script>
    // Initialize Auth0 client
    const auth0Client = new auth0.WebAuth({
      domain: 'dev-x4vh5dn1puh03czq.us.auth0.com',
      clientID: '6czlw25A9kwR2vTCSI1G3IFStxnqHyJ0'
    });
    
    // Check if user is authenticated
    function checkAuthentication() {
      const accessToken = localStorage.getItem('access_token');
      const idToken = localStorage.getItem('id_token');
      
      if (!accessToken || !idToken) {
        // No tokens found, redirect to login
        window.location.href = 'index.html';
        return;
      }
      
      // Verify the token
      auth0Client.validateToken(idToken, function(err, decoded) {
        if (err) {
          // Token invalid, clear storage and redirect to login
          localStorage.removeItem('access_token');
          localStorage.removeItem('id_token');
          window.location.href = 'index.html';
        } else {
          // User is authenticated, show content
          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
        }
      });
    }
    
    // Set up logout button
    document.getElementById('logoutButton').addEventListener('click', function() {
      // Clear tokens
      localStorage.removeItem('access_token');
      localStorage.removeItem('id_token');
      
      // Redirect to Auth0 logout endpoint
      auth0Client.logout({
        returnTo: window.location.origin + '/index.html'
      });
    });
    
    // Run authentication check when page loads
    window.addEventListener('load', checkAuthentication);
  </script>
</body>
</html>
