<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Deal - Verified by Thozhilali ✅</title>
    <style>
        /* Basic Page Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            background-color: #ff9900;
            color: white;
            padding: 15px;
            margin: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }

        /* Product Card Styling */
        .card {
            background: white;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        .price {
            color: #ff5722;
            font-size: 20px;
            font-weight: bold;
        }

        .buy-btn {
            display: block;
            width: 100%;
            background: #ff9900;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
        }

        .buy-btn:hover {
            background: #e68900;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <h1>Today's Deal - Verified by Thozhilali ✅</h1>

    <div class="container">

        <!-- Product 1 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/I/51Klb2eSf1L._SL1500_.jpg" alt="Product Image">
            <p class="product-title">Xiaomi Ultra Slim Power Bank - Lightest & Slimmest 10mm, 20W Fast Charging, Type-C Input & Output</p>
            <p class="price">-60% ₹1,999 <s>₹4,999</s></p>
            <a href="https://amzn.to/3CBFUZn" target="_blank" class="buy-btn">Buy Now</a>
        </div>
       

        <!-- Product 2 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/I/61LKTD-YnrL._SL1500_.jpg" alt="Product Image">
            <p class="product-title">realme Buds T110 </p>
            <p class="price">-63% ₹1,099 <s>₹2,999</s></p>
            <a href="https://amzn.to/4hQeo9z" target="_blank" class="buy-btn">Buy Now</a>
        </div>

        <!-- Product 3 -->
        <div class="card">
            <img src="https://m.media-amazon.com/images/I/51S19gkEn-L._SL1500_.jpg" alt="Product Image">
            <p class="product-title">OnePlus Pad Go 28.85cm</p>
            <p class="price">₹16,999 <s>19,999</s></p>
            <a href="https://amzn.to/4huPn3Y" target="_blank" class="buy-btn">Buy Now</a>
        </div>
    </div>

</body>
</html>
