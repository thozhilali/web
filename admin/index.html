<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Management</title>
    <script>
        // Password Protection
        function checkPassword() {
            const password = prompt("Enter Password:");
            if (password !== "786") {
                alert("Incorrect password! Access denied.");
                document.body.innerHTML = "<h2>Access Denied</h2>";
            }
        }
        document.addEventListener("DOMContentLoaded", checkPassword);
    </script>
    <script type="module">
        // Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCOckXXSfB5SWzgoOsFjuGvZ2yF6RMA9g0",
            authDomain: "thozhilaliadmin.firebaseapp.com",
            databaseURL: "https://thozhilaliadmin-default-rtdb.firebaseio.com",
            projectId: "thozhilaliadmin",
            storageBucket: "thozhilaliadmin.firebasestorage.app",
            messagingSenderId: "3832462237",
            appId: "1:3832462237:web:db465ab3bdc499dd208d74",
            measurementId: "G-V6PDDPQD91"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Function to Add Worker
        window.addWorker = function() {
            const name = document.getElementById("workerName").value.trim();
            const job = document.getElementById("workerJob").value;
            const area = document.getElementById("workerArea").value;
            const contact = document.getElementById("Contact").value.trim();

            if (!name) {
                alert("Please enter a worker's name!");
                return;
            }

            const workersRef = ref(database, 'workers');
            push(workersRef, { name, job, area, contact })
                .then(() => {
                    alert("Worker Added Successfully!");
                    document.getElementById("workerName").value = "";
                })
                .catch(error => console.error("Error adding worker:", error));
        };

        // Function to Load Workers
        function loadWorkers() {
            const workerList = document.getElementById("workerList");
            const workersRef = ref(database, 'workers');

            onChildAdded(workersRef, (snapshot) => {
                const worker = snapshot.val();
                const workerElement = document.createElement('li');
                workerElement.textContent = `${worker.name} - ${worker.job} - ${worker.area} - ${worker.contact}`;
                workerList.appendChild(workerElement);
            });
        }

        document.addEventListener('DOMContentLoaded', loadWorkers);
    </script>
</head>
<body>
    <h2>Worker Management</h2>
    <label for="workerName">Worker Name:</label>
    <input type="text" id="workerName" placeholder="Enter worker's name">
    
    <label for="workerJob">Job Type:</label>
    <select id="workerJob">
        <option value="Plumber">Plumber</option>
        <option value="Electrician">Electrician</option>
        <option value="Carpenter">Carpenter</option>
        <option value="ApplianceRepair">Appliance Repair</option>
    </select>
    
    <label for="workerArea">Area:</label>
    <select id="workerArea">
        <option value="Chennai">Chennai</option>
        <option value="Thiruvallur">Thiruvallur</option>
        <option value="Kanchipuram">Kanchipuram</option>
    </select>
    
    <label for="Contact">Contact</label>
    <input type="number" id="Contact" placeholder="Enter your 10 digit Number">
    
    <button onclick="addWorker()">Add Worker</button>
    
    <h3>Worker List</h3>
    <ul id="workerList"></ul>
</body>
</html>
