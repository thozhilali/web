};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

    function loadWorkers() {
        const workerList = document.getElementById("workerList");
        const areaFilter = document.getElementById("areaFilter").value;
        const jobFilter = document.getElementById("jobFilter").value;
        const workersRef = ref(database, "workers");

        onValue(workersRef, (snapshot) => {
            workerList.innerHTML = "";
            snapshot.forEach((childSnapshot) => {
                const worker = childSnapshot.val();
                if ((areaFilter === "All" || worker.area === areaFilter) &&
                    (jobFilter === "All" || worker.job === jobFilter)) {
                    
                        const workerCard = `<br><div class="card">
                            <h3>${worker.name}</h3>
                            <p><strong>Job:</strong> ${worker.job}</p>
                            <p><strong>Area:</strong> ${worker.area}</p>
                            <p><strong>Send Location:</strong> 
                            <button onclick="sendLocation('${worker.name}', '${worker.area}')">Send Location</button></p>
                            <br>
                            </div>`;
                    workerList.innerHTML += workerCard;
                }
            });
        });
    }

    //Location Tracking 
  function sendLocation(workerName, workerArea) {
    // Create and display loading message
    const loadingDiv = document.createElement('div');
    loadingDiv.id = 'locationLoadingMessage';
    loadingDiv.innerHTML = `
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                    background: rgba(0,0,0,0.7); display: flex; justify-content: center; 
                    align-items: center; z-index: 9999;">
            <div style="background: white; padding: 20px; border-radius: 8px; text-align: center;">
                <p>Getting your precise location...</p>
                <p>Please wait a moment</p>
                <p id="locationProgress">Initializing...</p>
            </div>
        </div>
    `;
    document.body.appendChild(loadingDiv);
    
    // Update the loading message with progress
    let progressElement = null;
    let progressInterval = null;
    
    function startProgressIndicator() {
        let dots = 0;
        progressElement = document.getElementById('locationProgress');
        progressInterval = setInterval(() => {
            dots = (dots + 1) % 4;
            progressElement.textContent = "Accessing GPS" + ".".repeat(dots);
        }, 500);
    }
    
    function clearProgress() {
        if (progressInterval) {
            clearInterval(progressInterval);
        }
    }
    
    startProgressIndicator();

    if (navigator.geolocation) {
        // Increased timeout for mobile devices
        const options = {
            enableHighAccuracy: true,
            timeout: 30000,         // 30 second timeout for mobile
            maximumAge: 0           // Always get fresh location
        };

        const geolocationRequest = navigator.geolocation.getCurrentPosition(
            position => {
                clearProgress();
                // Remove loading message
                if (document.contains(loadingDiv)) {
                    document.body.removeChild(loadingDiv);
                }
                
                // Get coordinates
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                
                // Google Maps location link
                const locationLink = `https://www.google.com/maps?q=${latitude},${longitude}`;
                
                // WhatsApp phone number
                const phoneNumber = "919419339434";
                
                // WhatsApp message
                const message = `Hello, I need a worker. Here are the details:\n\n` +
                              `🔹 Worker: ${workerName}\n` +
                              `📍 Area: ${workerArea}\n\n` +
                              `Here is my current location (accurate to ~${Math.round(accuracy)}m):\n${locationLink}`;
                
                // Try to detect if we're on iOS (which handles deep links differently)
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                
                try {
                    // WhatsApp link with encoded message
                    const whatsappLink = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
                    
                    // For iOS, we'll use a slight delay before redirecting
                    if (isIOS) {
                        setTimeout(() => {
                            window.location.href = whatsappLink;
                        }, 300);
                    } else {
                        // For Android and others
                        window.location.href = whatsappLink;
                    }
                } catch (e) {
                    alert("Error opening WhatsApp. Please try again or copy the location manually.");
                    console.error("WhatsApp redirect error:", e);
                }
            },
            error => {
                clearProgress();
                // Remove loading message
                if (document.contains(loadingDiv)) {
                    document.body.removeChild(loadingDiv);
                }
                
                let errorMessage = "Error getting your location. ";
                
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage += "Location permission denied. On mobile, please check your browser settings and ensure location access is enabled.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage += "Location unavailable. Please ensure GPS is enabled on your device.";
                        break;
                    case error.TIMEOUT:
                        errorMessage += "Location request timed out. Please try again with better GPS signal.";
                        break;
                    default:
                        errorMessage += "Unknown error: " + error.message;
                }
                
                alert(errorMessage);
                console.error("Geolocation error:", error);
            },
            options
        );
    } else {
        if (document.contains(loadingDiv)) {
            document.body.removeChild(loadingDiv);
        }
        alert("Geolocation is not supported by your browser. Please use a modern browser with location services.");
    }
}

    window.sendLocation = sendLocation;
    window.loadWorkers = loadWorkers;
</script>

       <!--Script for Service men-->
       <script>
        let services = [];
let citiesAndAreas = {}; // To hold the cities and areas data

// Fetch cities and areas data from the JSON file
fetch('https://raw.githubusercontent.com/thozhilali/thozhilali/main/citiesAndAreas.json')
    .then(response => response.json())
    .then(data => {
        citiesAndAreas = data; // Store the fetched data in citiesAndAreas
    })
    .catch(error => {
        console.error('Error fetching cities and areas:', error);
    });

// Fetch services data from the JSON file
fetch('https://raw.githubusercontent.com/thozhilali/thozhilali/main/services.json')
    .then(response => response.json())
    .then(data => {
        services = data; // Store the fetched data in the services array
    })
    .catch(error => {
        console.error('Error fetching services:', error);
    });

// Function to update the area dropdown based on the selected city
function updateAreas() {
    const city = document.getElementById("city").value;
    const areaDropdown = document.getElementById("area");

    // Clear existing areas
    areaDropdown.innerHTML = "<option value=''>Select Area</option>";

    // Get the areas for the selected city
    if (city && citiesAndAreas[city]) {
        citiesAndAreas[city].forEach(area => {
            const option = document.createElement("option");
            option.value = area;
            option.textContent = area;
            areaDropdown.appendChild(option);
        });
    }
}

// Function to filter and display services based on selected service type, city, and area
function filterServices() {
    const serviceType = document.getElementById("service").value;
    const city = document.getElementById("city").value.trim().toLowerCase();
    const area = document.getElementById("area").value.trim().toLowerCase();

    const filteredServices = services.filter(service => 
        service.name.toLowerCase().includes(serviceType) &&
        service.city.toLowerCase().includes(city) &&
        service.area.toLowerCase().includes(area)
    );

    displayServices(filteredServices);
}

// Function to display the filtered services
function displayServices(services) {
    const serviceList = document.getElementById("service-list");
    serviceList.innerHTML = ""; // Clear previous results

    if (services.length === 0) {
        serviceList.innerHTML = "<p>No services found in your location.</p>";
        return;
    }

    services.forEach(service => {
        const phoneLink = `<a href="tel:${service.phone}" class="phone-link">Call: ${service.phone}</a>`;
        const serviceCard = document.createElement("div");
        serviceCard.classList.add("container");
        serviceCard.innerHTML = `
            <br><br>
            <h3>${service.name}</h3>
            <p>${service.description}</p>
            <p>Location: ${service.city}, ${service.area}</p>
            <p>${phoneLink}</p>
        `;
        serviceList.appendChild(serviceCard);
    });
}
