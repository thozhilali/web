<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Workers</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOckXXSfB5SWzgoOsFjuGvZ2yF6RMA9g0",
            authDomain: "thozhilaliadmin.firebaseapp.com",
            databaseURL: "https://thozhilaliadmin-default-rtdb.firebaseio.com",
            projectId: "thozhilaliadmin",
            storageBucket: "thozhilaliadmin.firebasestorage.app",
            messagingSenderId: "3832462237",
            appId: "1:3832462237:web:db465ab3bdc499dd208d74",
            measurementId: "G-V6PDDPQD91"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        function loadWorkers() {
            const workerList = document.getElementById("workerList");
            const areaFilter = document.getElementById("areaFilter").value;
            const jobFilter = document.getElementById("jobFilter").value;
            const workersRef = ref(database, "workers");

            onValue(workersRef, (snapshot) => {
                workerList.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const worker = childSnapshot.val();
                    if ((areaFilter === "All" || worker.area === areaFilter) &&
                        (jobFilter === "All" || worker.job === jobFilter)) {
                        
                            const workerCard = `<div class="cardfw">
                                <h3>${worker.name}</h3>
                                <p><strong>Job:</strong> ${worker.job}</p>
                                <p><strong>Area:</strong> ${worker.area}</p>
                                <p><strong>Send Location:</strong> 
                                <button onclick="sendLocation('${worker.name}', '${worker.area}')">Send Location</button></p>
                                </div>`;
                        workerList.innerHTML += workerCard;
                    }
                });
            });
        }

        //Location Tracking 
        function sendLocation(workerName, workerArea) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                let latitude = position.coords.latitude;
                let longitude = position.coords.longitude;

                // Google Maps location link
                let locationLink = `https://www.google.com/maps?q=${latitude},${longitude}`;

                // WhatsApp phone number (replace with actual number)
                let phoneNumber = "919419339434"; // Replace with actual recipient's number

                // WhatsApp message including worker details and sender's location
                let message = `Hello, I need a worker. Here are the details:\n\n` +
                              `🔹 Worker: ${workerName}\n` +
                              `📍 Area: ${workerArea}\n\n` +
                              `Here is my current location:\n${locationLink}`;

                // WhatsApp link with encoded message
                let whatsappLink = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

                // Redirect to WhatsApp
                window.location.href = whatsappLink;
            }, error => {
                alert("Error getting location. Make sure location services are enabled.");
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    }
    window.sendLocation = sendLocation;

        window.loadWorkers = loadWorkers;
    </script>
</head>
<body>
    <h2>Find a Worker</h2>
    <select id="areaFilter" onchange="loadWorkers()">
        <option value="All">Select Area</option>
        <option value="Chennai">Chennai</option>
        <option value="Thiruvallvur">Thiruvallvur</option>
        <option value="Avadi">Avadi</option>
    </select>

    <select id="jobFilter" onchange="loadWorkers()">
        <option value="All">All Jobs</option>
        <option value="Plumber">Plumber</option>
        <option value="Electrician">Electrician</option>
        <option value="Carpenter">Carpenter</option>
        <option value="ApplianceRepair">Appliance Repair</option>
    </select>

    <div id="workerList" class="worker-container"></div>
    
</body>
</html>
